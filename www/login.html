<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecurOS GEA | Login</title>
    <link rel="icon" href="images/logos securOS__S.png" type="image/x-icon" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d1117;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .login-wrap {
            width: 100%;
            max-width: 380px;
            padding: 0 1rem;
        }

        .login-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 2.5rem 2rem 2rem;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 1.6rem;
        }

        .login-logo img {
            height: 56px;
            filter: brightness(0) invert(1);
            opacity: .85;
        }

        .login-logo .brand {
            display: block;
            margin-top: .5rem;
            font-size: .75rem;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #8b949e;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e6edf3;
            margin-bottom: 1.4rem;
            text-align: center;
        }

        label {
            display: block;
            font-size: .8rem;
            color: #8b949e;
            margin-bottom: .35rem;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: .55rem .75rem;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            font-size: .9rem;
            margin-bottom: 1rem;
            transition: border-color .2s;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #2C6FAC;
            box-shadow: 0 0 0 3px rgba(44,111,172,.2);
        }

        .btn-login {
            width: 100%;
            padding: .6rem;
            background: #2C6FAC;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: .95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s;
            margin-top: .4rem;
        }

        .btn-login:hover { background: #1a5a99; }
        .btn-login:active { background: #154f87; }

        .error-box {
            background: rgba(248,81,73,.12);
            border: 1px solid rgba(248,81,73,.4);
            border-radius: 6px;
            color: #f85149;
            font-size: .82rem;
            padding: .6rem .85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .error-box.show { display: block; }

        .footer-note {
            text-align: center;
            margin-top: 1.5rem;
            font-size: .72rem;
            color: #484f58;
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-logo">
                <img src="images/logos securOS__S.png" alt="SecurOS" />
                <span class="brand">SecurOS GEA</span>
            </div>

            <h2>Acesso ao Sistema</h2>

            <div class="error-box" id="errorBox">
                Usuário ou senha incorretos. Tente novamente.
            </div>

            <form method="POST" action="/login" autocomplete="off">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" placeholder="Nome de usuário" autofocus required />

                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Senha" required />

                <button type="submit" class="btn-login">Entrar</button>
            </form>
        </div>

        <div class="footer-note">SecurOS GEA &nbsp;·&nbsp; Acesso restrito aos usuários autorizados</div>
    </div>

    <script>
        if (window.location.search.indexOf("error=1") !== -1) {
            document.getElementById("errorBox").classList.add("show");
        }

        // Auto-login quando a página roda dentro do SecurOS Desktop:
        // o ISScustomAPI entrega o operador e autenticamos sem pedir senha.
        try {
            ISScustomAPI.onSetup(function (js_settings) {
                try {
                    var settings = JSON.parse(js_settings);
                    if (settings && settings.operator) {
                        fetch("/securos-login", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ operator: settings.operator })
                        })
                            .then(function (r) { return r.json(); })
                            .then(function (data) {
                                if (data && data.ok) window.location.href = "/";
                            })
                            .catch(function () {});
                    }
                } catch (e) {}
            });
        } catch (e) {}
    </script>
</body>
</html>
